e turning scores into probabilities.", "n": "", "r": ["Softmax", "Logprob"]}, {"t": "Softmax", "d": "The step that turns logits into probabilities that add up to 1.", "n": "", "r": ["Logit"]}, {"t": "Logprob", "d": "The logarithm of a token’s probability; close to 0 means confident.", "n": "Not all models or reasoning endpoints return logprobs.", "r": ["Calibration"]}, {"t": "Top-k", "d": "Only consider the k most likely next tokens.", "n": "", "r": ["Top-p", "Temperature"]}, {"t": "Top-p", "d": "Only consider the smallest set of tokens whose probabilities add up to p.", "n": "Also called nucleus sampling.", "r": ["Top-k"]}, {"t": "Min-p", "d": "Drop tokens less than a set fraction as likely as the top token.", "n": "An option, not a proven improvement.", "r": ["Top-p"]}, {"t": "Temperature", "d": "A setting that sharpens (low) or flattens (high) the model’s choices. Temperature 0 is not a reproducibility guarantee on most APIs.", "n": "", "r": ["Nondeterminism"]}, {"t": "TPR", "d": "True positive rate: of cases that are truly positive (e.g. human-passed), how many the test also marked positive.", "n": "", "r": ["TNR", "Recall"]}, {"t": "TNR", "d": "True negative rate: of cases that are truly negative (e.g. human-failed), how many the test also marked negative. For a judge, the safety number.", "n": "", "r": ["TPR"]}, {"t": "Criteria drift", "d": "Your idea of “good” changes as you read real outputs, so rubrics and judges must be versioned and re-validated.", "n": "Shankar et al.", "r": ["Rubric", "Judge"]}, {"t": "Position bias", "d": "A judge preferring an answer because of where it appears, not its quality.", "n": "", "r": ["Judge"]}, {"t": "Verbosity bias", "d": "A judge preferring longer answers.", "n": "", "r": ["Judge"]}, {"t": "User simulator", "d": "An LLM playing a scripted customer with a goal and persona, used to test multi-turn conversations.", "n": "", "r": ["Agent"]}, {"t": "Qrels", "d": "The answer key for search tests: which chunks are relevant to each question.", "n": "", "r": ["Recall@k", "nDCG"]}, {"t": "Recall@k", "d": "Of the relevant chunks, how many appear in the top k results.", "n": "", "r": ["Qrels"]}, {"t": "MRR", "d": "Mean reciprocal rank: average of 1 ÷ (rank of the first relevant result).", "n": "", "r": ["Qrels"]}, {"t": "nDCG", "d": "A 0–1 score for how well a ranked list puts the most relevant results first.", "n": "", "r": ["Qrels"]}, {"t": "Reranker", "d": "A slower model that re-reads the question and each top result together to reorder them.", "n": "", "r": ["Hybrid retrieval"]}, {"t": "Contextual retrieval", "d": "Adding a short, document-aware description to each chunk before indexing; Anthropic reported fewer retrieval failures.", "n": "", "r": ["Chunk"]}, {"t": "Faithfulness", "d": "Whether every claim in an answer is supported by the retrieved sources.", "n": "Also called groundedness.", "r": ["Hallucination"]}, {"t": "ISO/IEC 25059", "d": "The quality model for AI systems: correctness, robustness, adaptability, user controllability, intervenability, transparency, societal risk.", "n": "Used in ISTQB CT-AI Chapter 2.", "r": ["Metric"]}, {"t": "Back-to-back testing", "d": "Running old and new versions on identical inputs and comparing outputs.", "n": "", "r": ["Shadow testing"]}, {"t": "Shadow testing", "d": "Running a new version silently on real traffic without showing users its output.", "n": "", "r": ["Canary release"]}, {"t": "Canary release", "d": "Sending a small share of traffic to a new version with rollback ready.", "n": "", "r": ["Shadow testing"]}, {"t": "Stateless MCP", "d": "Since the 2026-07-28 spec, every MCP request carries what the server needs, so any instance can answer; sessions are gone.", "n": "", "r": ["MCP"]}, {"t": "Resource Indicators", "d": "RFC 8707: a client states which server a token is for, so it can’t be reused elsewhere.", "n": "Required for MCP clients from 2026-07-28.", "r": ["MCP"]}, {"t": "Protected Resource Metadata", "d": "RFC 9728: a server publishes which authorization server protects it.", "n": "", "r": ["MCP"]}, {"t": "OWASP Agentic Skills Top 10", "d": "The 2026 list of top risks for agent skills, from malicious skills to update drift.", "n": "", "r": ["Skill"]}, {"t": "Lethal trifecta", "d": "Private data access plus untrusted content plus a way to send data out — together they enable exfiltration.", "n": "", "r": ["Prompt injection"]}, {"t": "Indirect prompt injection", "d": "Malicious instructions hidden in content the AI reads, such as a PDF, email or web page.", "n": "", "r": ["Prompt injection"]}];
var ARCH=[{"n": "Dealer (end user)", "s": "Uses Yaksha", "tag": "v", "r": "Asks questions and gets work done through the dealer-facing assistant. Never sees the Console.", "i": "Questions, files they upload", "o": "Conversations recorded by the platform", "dep": "Yaksha", "f": "Asks things outside their data scope; uploads poor-quality scans", "e": "Represent real dealer questions — including out-of-scope and ambiguous ones — in your datasets."}, {"n": "Yaksha", "s": "The assistant", "tag": "v", "r": "The customer-facing face of DealerIQ: the AI chat that answers questions, summarizes work orders and looks things up.", "i": "Dealer messages", "o": "Answers, tool results, session records", "dep": "Gateway, skills, models, MCP tools, UMH knowledge", "f": "Wrong or ungrounded answers, wrong tool, missed abstention, leaking another dealer’s data", "e": "Groundedness, correct abstention, tool choice, scope, tone — across multi-turn sessions (27.07)."}, {"n": "Gateway", "s": "Runs AI conversations", "tag": "v", "r": "TargetMCP.Gateway (port 5200): orchestrates LLM chat and routes tool calls to MCP servers; resolves skills (lexical, gates 0–4); takes dealer context from the JWT; keeps eval capture, storage and results APIs. Completion skills are called on POST /api/completions-fast (and /api/completions).", "i": "Chat turns, completion requests with skill name, dms_type, messages and an IDMS token", "o": "Model responses, tool calls, session and token records", "dep": "Skills, models, MCP servers", "f": "400 unknown skill, 401 no dealer context, 403 skill not enabled or dms_type not permitted (or other dealer’s data), 429 rate limit, 503 provider unavailable; finish_reason is always \"stop\" — detect truncation from completion_tokens vs the 4,000 cap", "e": "Contract of the endpoint, error handling, rate limits, cost and latency per call (27.10)."}, {"n": "Dealer Resolution", "s": "Which dealers a caller may reach", "tag": "v", "r": "Derives Authorized.Read/Upsert/Delete from org structure and scope policy (FullAccess, BottomUp, LocationOnly) at session bootstrap and token mint — never on the request path.", "i": "Caller profile, Everest/slor org data", "o": "Authorised dealer set (effectiveDealerGuids)", "dep": "Everest, slor", "f": "Wrong policy on a node exposes or hides locations; outage = no new sessions", "e": "Multi-location scope cases (27.14)."}, {"n": "Agents & approvals", "s": "Saved, autonomous, HITL", "tag": "v", "r": "Gateway agents built from skills: saved (10/dealer), autonomous on cron or events (3/dealer), with quotas, circuit breaker, audit and requireApprovalFor gates.", "i": "Triggers, instructions, allowed skills/tools", "o": "Executions, approvals, audit events", "dep": "Skills, tools, scheduler", "f": "Approval values silently ignored, gates never exercised, runaway runs", "e": "Approve/reject/timeout/invalid-config cases (15.06)."}, {"n": "Skills (Studio → Skills)", "s": "SKILL.md packages", "tag": "v", "r": "Packaged instructions such as crm-promise-detection, published in DAC DEV → TEST → PROD with identical text; tests live under Skills → Tests.", "i": "Skill text and frontmatter (name, description, completion-enabled, category, surfaces)", "o": "Behaviour of the model when the skill is used", "dep": "Gateway, models", "f": "Platform fields lost on save, version drift between repo (v3) and DAC (v4), wrong rule wording", "e": "Lint, trigger (for chat-routed skills), uplift, reliability, regression per version (27.02, 27.11)."}, {"n": "Models (Studio → Models)", "s": "Chat models", "tag": "v", "r": "The models available to skills and chat, such as gpt-5.4-mini for promise detection.", "i": "Prompt", "o": "Generated text", "dep": "Provider", "f": "Quality differs by model; cost spread across tiers is large", "e": "Same dataset across candidate models; cost per correct outcome (27.10)."}, {"n": "UMH", "s": "Files & search", "tag": "v", "r": "The “library” that stores dealer files and turns them into something the AI can search: ingestion, embeddings, OCR, rerank. Knowledge shelves sit here.", "i": "Dealer documents", "o": "Searchable chunks and retrieval results", "dep": "OCR and embedding models", "f": "Bad OCR, poor chunking, retrieval misses; UMH costs are real dealer work and never count as eval traffic", "e": "Ingestion/OCR checks, retrieval precision/recall separately from answers (27.08)."}, {"n": "MCP servers (TargetMCP)", "s": "Customer · Order · Insights · CrossRef · ExternalSignals · Portal", "tag": "v", "r": "Domain tool providers behind the Gateway. Each exposes /health, /tools and /mcp (JSON-RPC), uses TargetMCP.Common for protocol, auth and the Everest client, and keeps tools explicit and dealer-scoped.", "i": "tools/call with the user’s or a brokered JWT; arguments with dealerGuid pinned by the Gateway when the schema declares it", "o": "MCP content (text: prose or serialized JSON), or a sanitized error", "dep": "Everest API (IDMS client credentials) → IDEAL database; Insights uses Databricks; CrossReference an API key", "f": "Schema vs implementation gaps (e.g. get_order_details identifier rule), 401 for brokered sessions before AB#182310, CrossReference has no dealer check by design", "e": "Four-way contract per tool, dealer isolation (DealerContextValidator), auth per hop, write-tool side effects (27.06)."}, {"n": "TargetCRM (caller)", "s": "Coaching AI workflow", "tag": "v", "r": "Picks conversations with new messages, builds the transcript, calls the skill, validates the response, saves it, adds rep/department/revenue, and lets a manager act.", "i": "Conversations from its database", "o": "Rows in Customers.CustomerSentimentObligation; the We Owe queue", "dep": "Gateway, IDMS token", "f": "Invalid JSON, cut-off answers (completion_tokens ≥ 4000), ids not in transcript, low-confidence items", "e": "The validator rules themselves, end to end (27.03)."}, {"n": "Everest API → IDEAL DB", "s": "System of record", "tag": "v", "r": "The API the MCP servers call for dealer data; writes reach the IDEAL (Firebird) database through the IDEAL reverse proxy.", "i": "Bearer token from IDMS client credentials", "o": "Dealer records", "dep": "IDMS", "f": "401 on wrong scope or expired token; timeouts (30 s default)", "e": "That tool errors surface as sanitized errors, never as empty successes."}, {"n": "DealerIQ Console (DAC)", "s": "DealerAIConsole — back office", "tag": "v", "r": "The DealerAIConsole: usage & costs, adoption, dealers, chat sessions, settings, and eval authoring — cases, rubrics, launching runs, Runs / Compare models / Datasets / Review views, and the run budget.", "i": "Gateway and UMH records", "o": "Reports, reviews, scoped settings", "dep": "Gateway, UMH, access layer", "f": "Mistaking it for the assistant; mixing eval and real usage", "e": "That eval runs, review and case context behave as documented (27.09)."}, {"n": "Evals bench", "s": "Runs, datasets, review", "tag": "v", "r": "Runs & datasets, Eval Review and Case context in DAC; the harness runs in DealerIQ.Evals and posts results to the Gateway. Replay or live-provider; PROD live runs refused; DEV budget $5 per 24 h; 5 cases per live run.", "i": "Datasets, rubrics, skill drafts", "o": "Run results, reviews, case context", "dep": "Gateway (DEV)", "f": "Trying to author on PROD (an environment rule, not a bug); the Eval segment excludes UMH", "e": "Run procedure and the honesty of what results include (27.09, 27.11)."}, {"n": "Access layer", "s": "Three questions", "tag": "v", "r": "Can you get in? (allowlist + AD group). What may you do? (operator/viewer — fails open). What may you see? (product + DMS-type scope — fails closed). The server re-checks on every save.", "i": "User identity, grants, scope records", "o": "Allowed or refused actions; out-of-scope data reads as “not found”", "dep": "Directory, scope records", "f": "A missing record on a fail-open axis grants too much; hidden buttons are only a courtesy", "e": "Scope cases in every dataset; “not found” vs “forbidden” vs “unavailable” (27.06)."}, {"n": "Environments", "s": "DEV / TEST / PROD", "tag": "v", "r": "One console serves three worlds through an environment switcher (X-Env header). Each has its own data; limits differ (DEV/TEST 30/min, 200/h; PROD 60/min, 500/h for completions).", "i": "Env selection", "o": "Env-specific data and rules", "dep": "Gateway per environment", "f": "Comparing numbers across environments; PROD where a skill is not yet published returns unknown_skill", "e": "Always record the environment with every run and result."}];
var L27={"27.01": {"s": [{"id": "planes", "t": "DealerIQ in one picture: four planes", "tag": "v", "h": "<table><tr><th>Plane<\/th><th>Where<\/th><th>Owns<\/th><\/tr>\n<tr><td><b>Runtime<\/b><\/td><td>TargetMCP (ADO): Gateway + MCP servers<\/td><td>Chat and completion requests, auth, skill resolution, guardrails, tool calls to Customer/Order/Insights/CrossReference/ExternalSignals/Portal, eval capture and results APIs<\/td><\/tr>\n<tr><td><b>Identity and scope<\/b><\/td><td>IDMS / ASPEN / Altura for <i>who<\/i>; DealerIQ.DealerResolution for <i>which dealers they may reach<\/i><\/td><td>Org structure, scope policy per node (<code>FullAccess<\/code>, <code>BottomUp<\/code>, <code>LocationOnly<\/code>), DMS tenant keys; returns <code>Authorized.Read/Upsert/Delete<\/code>. Called at session bootstrap and token mint — <b>never on the request path<\/b>, so an outage means “no new sessions”, not “nothing works”.<\/td><\/tr>\n<tr><td><b>Evaluation<\/b><\/td><td>DealerIQ.Evals (GitHub)<\/td><td>Harness, git suites, KPI and rubric specs, the GitHub Actions queue drainer<\/td><\/tr>\n<tr><td><b>Control and viewing<\/b><\/td><td>DealerAIConsole (DAC)<\/td><td>Usage and cost, support drilldowns, per-dealer settings write-proxies, Studio (Skills, Knowledge shelves, Models), Evals launch, Runs, Datasets, Eval Review. DAC’s own database role is SELECT-only.<\/td><\/tr><\/table>\n<p>Two more repos complete the picture: <b>DealerIQ.ReleaseOps<\/b> (release evidence: <i>deployed is shipped; merged is not shipped<\/i>) and <b>DealerIQ.BrowserAgent<\/b> (a read-only, DEV-only PoC MCP server that drives Chromium so the assistant can read TargetCRM screens).<\/p><p class=\"small muted\">Sources (read-only, 2026-10-25): TargetMCP (ADO), DealerIQ.Evals, DealerAIConsole, DealerIQ.DealerResolution, DealerIQ.ReleaseOps, DealerIQ.BrowserAgent, workshop repos 1–4.<\/p>"}, {"id": "chat", "t": "Lifecycle 1 — one dealer chat turn, end to end", "tag": "d", "h": "<ol>\n<li><b>Dealer asks Yaksha<\/b> in Garuda, TargetDMS.Web, TDMS.Web, DIS or ASPEN. The app sends the user’s JWT.<\/li>\n<li><b>Gateway authenticates<\/b>: <code>IssuerSchemeRouter<\/code> picks the scheme by issuer (IDMS, ASPEN/Charter, Brokered); signature, lifetime (zero clock skew) and — in PROD — audience and issuer are validated. <i>Fails as 401.<\/i><\/li>\n<li><b>Context is resolved<\/b>: dealer from the token’s <code>profile<\/code> claim (a body <code>dealerGuid<\/code> is overwritten; mismatch → 403); the <b>consumer id<\/b> (which app) from the scheme or the token’s <code>client_id<\/code>; the authorised dealer set from Dealer Resolution, minted at session start.<\/li>\n<li><b>Input guardrails<\/b>: prompt-injection and sensitive-info checks. A block short-circuits with a canned refusal and zero tokens (<code>PromptInjection<\/code>, <code>BrandProtection<\/code>, <code>SensitiveInfoRequest<\/code>, <code>TopicRelevance<\/code>, <code>DealershipReputation<\/code>).<\/li>\n<li><b>Skill resolution<\/b>: persona → consumer → lexical trigger score ≥ 0.30 (or auto-load) → top 2 → bind (tools, capabilities, dms-type, UMH content). Survivors are injected as workflow instructions, truncated past 1,500 tokens. <i>Most skill failures happen here, silently.<\/i><\/li>\n<li><b>Model call<\/b>: the product’s bound model (DAC Models page) or the default route. Today chat runs on OpenAI.com; the move to DealerIQ’s Azure OpenAI deployments (RM-01) is gated by eval parity runs.<\/li>\n<li><b>Tool calls<\/b>: the model proposes a call; the Gateway pins <code>dealerGuid<\/code>/<code>dealerId<\/code> where the schema declares them and calls the MCP server with the user’s or a brokered token. The server re-checks the dealer (<code>DealerContextValidator<\/code>) and calls Everest with its own client-credentials token. Results return as text.<\/li>\n<li><b>Loop<\/b> until the model answers; <b>output guardrails<\/b> redact secrets and PII.<\/li>\n<li><b>Recorded<\/b>: session, tool calls, tokens and cost — visible in DAC Chat sessions and Usage & Costs; a 👍/👎 lands in a review queue.<\/li><\/ol>\n<div class=\"callout\">For each step, ask: <i>what evidence would show it worked, and which eval check sees it?<\/i> Steps 2–3 → auth and scope cases; 4 → <code>expected_block_reason<\/code>; 5 → resolution debugging; 7 → <code>required_tools<\/code>, <code>argument_rules<\/code>; 9 → cost and latency KPIs.<\/div><p class=\"small muted\">Sources (read-only, 2026-10-25): TargetMCP (ADO), DealerIQ.Evals, DealerAIConsole, DealerIQ.DealerResolution, DealerIQ.ReleaseOps, DealerIQ.BrowserAgent, workshop repos 1–4.<\/p>"}, {"id": "completion", "t": "Lifecycle 2 — a completion call (promise detection)", "tag": "d", "h": "<ol><li>TargetCRM builds the transcript and calls <code>POST /api/completions-fast<\/code> with <code>skill<\/code>, <code>dms_type<\/code> and the user’s IDMS token.<\/li><li>Authorisation is the token’s DMS type <b>plus<\/b> the skill’s <code>completion-enabled: true<\/code>. Errors: 400 unknown skill, 401 no dealer context, 403 not enabled or DMS not permitted, 429 rate limit, 503 provider.<\/li><li>The named skill is loaded directly — no trigger matching. DAC’s skill-testing design notes <code>/api/completions<\/code> was the one named-skill path that bypassed visibility gates; the planned fix makes skills declare <code>surfaces: [chat, completions, dispatch]<\/code> and enforces them (crm-promise-detection already declares <code>surfaces: [completions]<\/code>).<\/li><li>The route governs the model and cost cap; <code>model<\/code>/<code>temperature<\/code>/<code>max_tokens<\/code> in the request are ignored.<\/li><li>The answer comes back <b>verbatim<\/b> in <code>choices[0].message.content<\/code>; <code>finish_reason<\/code> is always <code>\"stop\"<\/code>, so truncation must be detected from <code>completion_tokens<\/code> against the 4,000 cap.<\/li><li>The caller validates, saves and acts. DealerIQ never executes or validates the output.<\/li><\/ol><p class=\"small muted\">Sources (read-only, 2026-10-25): TargetMCP (ADO), DealerIQ.Evals, DealerAIConsole, DealerIQ.DealerResolution, DealerIQ.ReleaseOps, DealerIQ.BrowserAgent, workshop repos 1–4.<\/p>"}, {"id": "skilllife", "t": "Lifecycle 3 — a skill’s life", "tag": "d", "h": "<ol><li><b>Author<\/b> in DAC → Studio → Skills: Simple mode (name, what it does, when to use it, instructions, category → assembled SKILL.md) or Advanced mode (raw SKILL.md plus gates, tools, flags). There are about 13 global system skills; per-dealer skills are deprecated (writes return 410).<\/li><li><b>Validate<\/b> (structure) and <b>scan<\/b> (prompt-injection and safety) — scan is mandatory before publish in Advanced mode.<\/li><li><b>Test this draft<\/b> (planned, DEV-only, default-off): the draft is injected into a per-request overlay for an authorised eval identity, never into the shared pool, and every run is bound to the draft’s content digest so evidence can’t be stale.<\/li><li><b>Publish<\/b> with an “affects all dealers of these DMS types” confirmation. Publishing shows evidence but does not block. Published skills reach the runtime through a 5-minute cache.<\/li><li><b>Rollback<\/b> in one click if behaviour regresses.<\/li><\/ol>\n<p><b>Who may edit:<\/b> per-user Level (read / read-write) × Scope (all skills, or specific DMS types: Ideal, Infinity, Softbiz, Aspen, DIS), mapped onto each skill’s own <code>dmsTypes<\/code> gate.<\/p>\n<div class=\"callout warn\"><b>The insight that drives your work:<\/b> DAC’s plan states that <i>most skill failures are resolution failures, not writing failures<\/i>. AB#180772: a skill that declared no tools and no capabilities was never usable, so it was invisible everywhere and the only symptom was “the assistant ignored my skill”. Always check resolution before judging the writing.<\/div><p class=\"small muted\">Sources (read-only, 2026-10-25): TargetMCP (ADO), DealerIQ.Evals, DealerAIConsole, DealerIQ.DealerResolution, DealerIQ.ReleaseOps, DealerIQ.BrowserAgent, workshop repos 1–4.<\/p>"}, {"id": "evallife", "t": "Lifecycle 4 — an eval case and a run", "tag": "d", "h": "<ol><li><b>Where cases come from<\/b>: git suites in DealerIQ.Evals (golden, adversarial, drift-canary, per-consumer certification), or <code>db:<\/code> datasets authored in DAC. Workshop 3 states the route for real-use judgement: a 👍/👎 lands in a review queue, and someone promotes a thumbs-down into a scenario.<\/li><li><b>Launch<\/b> in DAC → a row in <code>eval_run_requests<\/code> → a <code>workflow_dispatch<\/code> to the GitHub Actions drainer (DEV-only in v1; one run in flight per environment).<\/li><li><b>Run<\/b>: replay (re-grade fixtures, free) or live-provider (the real Gateway, judge required, 1–20 selected cases, signed in as a fixed eval identity; PROD live refused).<\/li><li><b>Grade<\/b>: deterministic checks, then answer quality (core judge plus case graders).<\/li><li><b>Ingest<\/b>: <code>post-run<\/code> to the Gateway → <code>eval_runs<\/code>, <code>eval_scenario_results<\/code>.<\/li><li><b>Read<\/b> in DAC Runs, Trends and Review: READY / WARNING / BLOCKED / NO_DATA.<\/li><\/ol>\n<p>Permissions are split on purpose: in workshop 3 a participant’s sign-in could publish skills and write reviews, but not edit datasets or launch runs.<\/p><p class=\"small muted\">Sources (read-only, 2026-10-25): TargetMCP (ADO), DealerIQ.Evals, DealerAIConsole, DealerIQ.DealerResolution, DealerIQ.ReleaseOps, DealerIQ.BrowserAgent, workshop repos 1–4.<\/p>"}, {"id": "change", "t": "Lifecycle 5 — a model or platform change", "tag": "v", "h": "<ul><li><b>Model upgrade (G5)<\/b>: <code>ab-model<\/code> on DEV with <code>--trials 5<\/code> → fix every blocked reason, a person accepts each review item → repeat on TEST → pin the new model version in PROD through the normal cut.<\/li><li><b>RM-01<\/b>: moving chat from OpenAI.com to DealerIQ’s Azure OpenAI (US data zone, pinned versions); each environment moves only after an eval-graded parity run (DEV moved 2026-10-03; TEST waits on quota).<\/li><li><b>RM-06<\/b>: product owners choose their product’s model in DAC’s Models page; the Console recommends an eval on that product’s cases first and warns when there is none.<\/li><li><b>RM-27<\/b>: GPT-4o and GPT-4.1 retire on <b>2027-01-14<\/b>; routes still on them move to gpt-6-luna, checked by Console-authored eval cases for any product, DMS and endpoint, on DEV and TEST.<\/li><li><b>RM-20<\/b>: drift detection — each product gets a regular baseline run, compared with the previous one, naming what changed (model, silent provider upgrade, skill, base prompt, product binding).<\/li><\/ul><p class=\"small muted\">Sources (read-only, 2026-10-25): TargetMCP (ADO), DealerIQ.Evals, DealerAIConsole, DealerIQ.DealerResolution, DealerIQ.ReleaseOps, DealerIQ.BrowserAgent, workshop repos 1–4.<\/p>"}, {"id": "gates", "t": "Access gates: three lanes, one narrowing rule", "tag": "v", "h": "<p>Authentication says <i>who<\/i> is calling; access gates decide <i>what that caller may reach<\/i>. TargetMCP counts fifteen gates in three lanes:<\/p><table><tr><th>Lane<\/th><th>Lives in<\/th><th>Changed by<\/th><th>Takes<\/th><\/tr><tr><td>Structure<\/td><td>appsettings in the repo<\/td><td>engineer: PR → deploy per env<\/td><td>hours to days<\/td><\/tr><tr><td>Policy<\/td><td>Postgres policy stores<\/td><td>operator, one DAC screen<\/td><td>seconds<\/td><\/tr><tr><td>Content<\/td><td>the skill record<\/td><td>skill author in DAC<\/td><td>seconds per skill<\/td><\/tr><\/table>\n<ul><li><b>Narrowing rule:<\/b> a policy record may only narrow what structure permits — an operator screen cannot grant access. Denies from config and store combine as a union.<\/li><li><b>Blast-radius exception:<\/b> a gate whose mistake would expose one tenant’s data to another, or a dealer’s data to its customers, stays in the reviewed lane however often it changes.<\/li><\/ul>\n<table><tr><th>Gate<\/th><th>Default when absent<\/th><th>Test it<\/th><\/tr><tr><td><code>AllowedClientIds<\/code> (server group)<\/td><td>Open to all — but <b>fails closed on a null client_id, which is every brokered session<\/b><\/td><td>Tool availability in console-eval sessions<\/td><\/tr><tr><td>skill <code>consumers<\/code><\/td><td>Visible to everyone<\/td><td>Skill leakage into the wrong app<\/td><\/tr><tr><td>skill <code>dms-types<\/code><\/td><td><b>Fail-open<\/b> when dms_type is missing — except <code>/api/completions<\/code>, which is fail-closed<\/td><td>Same skill on chat vs completions<\/td><\/tr><tr><td>skill <code>personas<\/code><\/td><td>Dealer users only — the portal never sees an untagged skill<\/td><td>Portal sessions<\/td><\/tr><tr><td>Group <code>DmsTypes<\/code><\/td><td>Fails closed when dms_type is unresolved<\/td><td>Tokens with missing DMS type<\/td><\/tr><tr><td>Connector enablement<\/td><td>Off; explicit per-dealer enablement<\/td><td>Dealer without the connector<\/td><\/tr><\/table>\n<div class=\"callout warn\"><b>Documented weaknesses worth a test each:<\/b> <code>CustomerPortalToolCatalogValidator<\/code> only logs a drifted portal tool instead of dropping it; App Service settings can silently override config with no repo diff; an unreadable policy store must fail closed for the portal persona.<\/div><p class=\"small muted\">Source: TargetMCP docs/concepts/ACCESS_GATES.md (last verified 2026-08-17) — read 2026-10-25.<\/p>"}, {"id": "release", "t": "Lifecycle 6 — release and evidence", "tag": "v", "h": "<p>ReleaseOps’ rule: <b>deployed is shipped; merged is not shipped<\/b>. A weekly shipping report goes to Teams with a year-to-date report behind it. Eval reports are the evidence attached to promotions; a production claim without deployment evidence is labelled as an inferred signal, never as a release.<\/p><p class=\"small muted\">Sources (read-only, 2026-10-25): TargetMCP (ADO), DealerIQ.Evals, DealerAIConsole, DealerIQ.DealerResolution, DealerIQ.ReleaseOps, DealerIQ.BrowserAgent, workshop repos 1–4.<\/p>"}, {"id": "you", "t": "Where your Q4 work sits", "tag": "d", "h": "<table><tr><th>Roadmap item<\/th><th>What you do<\/th><\/tr><tr><td><b>RM-07 — TargetCRM AI<\/b> (AI Coaching / Customer Sentiment, Campaign Ideas)<\/td><td>Evaluate crm-promise-detection and related skills before they leave prototype: datasets from real conversations, deterministic and judge graders, release gates<\/td><\/tr><tr><td><b>RM-27<\/b> — evals for any product from the Console; GPT-4o/4.1 retirement<\/td><td>Author Console cases for TargetCRM routes so the model switch is checked, not assumed<\/td><\/tr><tr><td><b>RM-20<\/b> — drift<\/td><td>Keep a baseline suite for your skills so a silent change is visible<\/td><\/tr><tr><td><b>RM-06<\/b> — product model choice<\/td><td>Provide the eval the Console asks for before a product’s model changes<\/td><\/tr><tr><td>TargetMCP<\/td><td>Contract, scope and auth evaluation of the tools Yaksha uses (27.06)<\/td><\/tr><\/table>"}, {"id": "why", "t": "Why a system map comes before any eval", "tag": "a", "h": "<p>Every evaluation answers one question: <i>did this part of the system do its job?<\/i> You cannot answer it until you know which part did what. In DealerIQ the same dealer question passes through several components — the assistant, the Gateway, a skill, a model, tools and the knowledge library — and each can fail on its own. A wrong answer might be a retrieval miss in UMH, a bad tool result from an MCP server, a skill instruction the model ignored, or simply the wrong environment.<\/p><p>So the first competence is to be able to point at a failure and say <b>where<\/b> it happened. That decides which dataset, grader and fix apply.<\/p>"}, {"id": "tmcp", "t": "What TargetMCP is: DealerIQ’s control plane", "tag": "v", "h": "<p>The <b>TargetMCP<\/b> repository holds DealerIQ’s control plane: the <b>Gateway<\/b> (the LLM orchestration layer, port 5200) and the <b>MCP servers<\/b> that give the AI its tools. The repository’s own one-line picture:<\/p>\n<div class=\"flow\"><span>Garuda / TargetPOS + Yaksha<\/span><i>→ HTTP →<\/i><span>LLM Gateway (5200)<\/span><i>→ MCP protocol →<\/i><span>MCP servers<\/span><i>→<\/i><span>Everest API<\/span><i>→<\/i><span>IDEAL database<\/span><\/div>\n<table><tr><th>MCP server<\/th><th>Port<\/th><th>Domain<\/th><\/tr><tr><td>TargetMCP.Customer<\/td><td>5100<\/td><td>Customer operations<\/td><\/tr><tr><td>TargetMCP.Order<\/td><td>5101<\/td><td>Work orders and invoices<\/td><\/tr><tr><td>TargetMCP.Insights<\/td><td>5103<\/td><td>Sales analytics via Databricks<\/td><\/tr><tr><td>TargetMCP.CrossReference<\/td><td>5104<\/td><td>OEM / aftermarket parts cross-reference<\/td><\/tr><tr><td>TargetMCP.ExternalSignals<\/td><td>5105<\/td><td>Weather, disasters, regulatory recalls<\/td><\/tr><tr><td>TargetMCP.CustomerPortal<\/td><td>—<\/td><td>Customer-portal tools<\/td><\/tr><\/table>\n<p>The repo also defines its three building blocks, smallest to largest: a <b>tool<\/b> is one concrete action (the verb); a <b>skill<\/b> is a plain-English playbook that says which tools to use and how (the know-how); an <b>agent<\/b> pursues a multi-step goal using skills, optionally on a schedule or a business event, within guardrails.<\/p>\n<p><b>DAC<\/b> is the <b>DealerAIConsole<\/b> — the Console you author cases and rubrics in. The eval harness and git datasets live in a separate repository, <b>DealerIQ.Evals<\/b> (GitHub); the Gateway keeps eval capture, storage and the results APIs.<\/p><p class=\"small muted\">Source: TargetMCP repo (Ideal Agile), branch main, commit 6659654 — read on 2026-10-25.<\/p>"}, {"id": "parts", "t": "The parts, in plain terms", "tag": "v", "h": "<table><tr><th>Component<\/th><th>What it is<\/th><\/tr>\n<tr><td><b>Yaksha<\/b><\/td><td>The dealer-facing AI assistant. Dealers talk to it; it answers, summarizes work orders and looks things up.<\/td><\/tr>\n<tr><td><b>DealerIQ Console<\/b><\/td><td>The internal back office. Staff use it to watch usage, cost and adoption, support dealers, and check the assistant’s quality. No dealer sees it. It is <b>not<\/b> the assistant.<\/td><\/tr>\n<tr><td><b>Gateway<\/b><\/td><td>Runs the AI conversations and agent steps, connects to MCP, records sessions and token spend. Completion skills are called on <code>POST {gateway}/api/completions-fast<\/code>.<\/td><\/tr>\n<tr><td><b>UMH<\/b><\/td><td>Stores dealer files and makes them searchable: ingestion, embeddings, OCR, rerank. Knowledge shelves live here.<\/td><\/tr>\n<tr><td><b>Skills / Models<\/b><\/td><td>Under Studio in the Console: packaged instructions and the chat models they run on.<\/td><\/tr>\n<tr><td><b>Evals<\/b><\/td><td>Runs & datasets, Eval Review and Case context — the quality bench.<\/td><\/tr><\/table>\n<p>The Console mostly <i>reads<\/i> what Gateway and UMH recorded; its few edits are proxied back to them.<\/p>"}, {"id": "explore", "t": "Interactive architecture explorer", "tag": "v", "h": "<div data-w=\"arch\"><\/div>"}, {"id": "flows", "t": "Two request paths you will test", "tag": "v", "h": "<p><b>Path 1 — a dealer asks Yaksha.<\/b> Dealer → Yaksha → Gateway → (skill instructions, model, MCP tools such as TargetMCP, UMH retrieval) → answer → session recorded → visible in Console Chat sessions and Eval Review.<\/p>\n<p><b>Path 2 — TargetCRM calls a completion skill.<\/b> CRM picks two-way conversations with new messages → builds the transcript → <code>POST /api/completions-fast<\/code> with <code>skill: crm-promise-detection<\/code>, <code>dms_type<\/code> and the signed-in user’s IDMS token → Gateway runs the skill on the model → returns text → CRM strips a code fence, parses, validates, saves to <code>Customers.CustomerSentimentObligation<\/code> → a manager acts. Nothing sends itself.<\/p>\n<div class=\"callout\">Path 2 has <b>no chat routing<\/b>: the caller names the skill. So for promise detection, trigger testing matters little, and output correctness matters a lot. For Yaksha (path 1), selection — of skills and tools — is itself something to evaluate.<\/div>"}, {"id": "access", "t": "Access, scope and environments", "tag": "v", "h": "<p>Access is three stacked questions. <b>Can you get in?<\/b> (allowlist + AD group). <b>What may you do?<\/b> (operator / viewer — fails <i>open<\/i>: no record means full access). <b>What may you see?<\/b> (product + DMS-type scope — fails <i>closed<\/i>: no record means nothing). The server re-checks on every save; hidden buttons are only a courtesy.<\/p>\n<p>Out-of-scope data reads as <b>“not found”, never “forbidden”<\/b>. That is by design: it avoids confirming that hidden data exists. When you test, a “not found” for another dealer’s record is a <i>pass<\/i>, not a bug.<\/p>\n<p>One console serves <b>DEV, TEST and PROD<\/b>. Launching eval runs and “test this draft” are DEV-only; authoring eval cases, rubrics, skill tests and case context is refused on PROD. Record the environment with every result — numbers are not comparable across environments.<\/p><div class=\"callout warn\"><b>Two different “no” answers — don’t mix them up.<\/b> The <b>Console<\/b> shows out-of-scope data as “not found”. The <b>Gateway API<\/b> is different: it takes <code>dealerGuid<\/code> from the JWT <code>profile<\/code> claim, overwrites any <code>dealerGuid<\/code> the client sends, and rejects a request for another dealer’s data with <b>403 Forbidden<\/b> (TargetMCP <code>AUTHN_AND_AUTHZ.md<\/code>). Test each surface against its own documented behaviour.<\/div>"}, {"id": "where", "t": "Locating a failure: worked example", "tag": "d", "h": "<p>A dealer reports: “Yaksha told me a part was in stock; it wasn’t.” Work it like a defect:<\/p><ol>\n<li><b>Find the session<\/b> in Console → Chat sessions. Read what was actually said.<\/li>\n<li><b>Was a tool called?<\/b> If TargetMCP (or another tool) returned “in stock”, the defect is in the tool or its data — not the model.<\/li>\n<li><b>Was retrieval used?<\/b> If the answer came from a knowledge shelf, check whether the retrieved chunk said that. If not, it is a grounding failure.<\/li>\n<li><b>No tool, no retrieval?<\/b> The model stated a fact it had no source for — a hallucination. The fix belongs in instructions (abstain without a source) and in your dataset (add this case).<\/li>\n<li><b>Which environment and model?<\/b> Note both; a PROD issue cannot be re-authored there.<\/li><\/ol>"}, {"id": "mistakes", "t": "Common mistakes", "tag": "a", "h": "<ul><li>Testing the Console as if it were the assistant. The Console reports; Yaksha answers.<\/li><li>Reading a scoped “not found” as a defect.<\/li><li>Mixing eval traffic into real usage numbers — the Console’s Segment toggle separates Real and Eval, and Eval excludes UMH (ingestion is real dealer work, never an eval run).<\/li><li>Comparing results across DEV and PROD.<\/li><\/ul>"}], "quiz": [{"q": "In the DealerIQ Console, a staff user opens another dealer’s record they are not scoped to and sees “not found”. What is it?", "o": ["A bug: the record exists", "Expected: out-of-scope data reads as “not found”", "A model hallucination", "A UMH ingestion failure"], "a": 1, "e": ["The record may exist, but showing that would leak it.", "Correct: the data-scope axis fails closed and out-of-scope reads as not found, by design.", "No model fabrication is involved — this is the access layer.", "Ingestion is unrelated to access scope."]}, {"q": "Which statement about the Console is true?", "o": ["Dealers use it to chat", "It mostly reads what Gateway and UMH recorded", "It runs the AI conversations", "It stores dealer files"], "a": 1, "e": ["Dealers use Yaksha.", "Correct: it is a mostly read-only back office; a few writes are proxied back.", "That is the Gateway.", "That is UMH."]}, {"q": "You try to author a rubric on PROD and it is refused. What do you log?", "o": ["A permissions defect", "Nothing — it is an environment rule; author in DEV", "A Gateway outage", "A skill defect"], "a": 1, "e": ["It is not a permission problem.", "Correct: authoring is refused on PROD by design.", "No outage is involved.", "The skill is not involved."]}, {"q": "For crm-promise-detection, why is a trigger test less important than for a Yaksha skill?", "o": ["Because it uses a cheaper model", "Because the caller names the skill — there is no routing to test", "Because it has no description", "Because it is only on PROD"], "a": 1, "e": ["Cost has nothing to do with routing.", "Correct: TargetCRM calls it by name, so correctness of output dominates.", "It has a description.", "It is not yet published on PROD."]}, {"q": "A client calls the Gateway with a dealerGuid in the body that differs from its token’s dealer. What happens?", "o": ["The body value is used", "The token’s dealerGuid wins; a request for another dealer’s data gets 403", "The request is silently ignored", "The MCP server decides"], "a": 1, "e": ["Using the body value would allow cross-tenant access.", "Correct: dealer context comes from the JWT profile claim and overwrites the body; mismatches are rejected with 403.", "It is not silent — the documented response is 403.", "The Gateway enforces this before any tool call; the MCP server adds a second check."]}, {"q": "Dealer Resolution is down. What breaks first?", "o": ["Every chat request", "New sessions — it is called at bootstrap and mint, never on the request path", "Only evals", "Nothing"], "a": 1, "e": ["Existing sessions already carry their authorised dealers.", "Correct.", "It is not eval-specific.", "New sessions cannot be minted."]}, {"q": "A newly published skill isn’t used in Yaksha for a few minutes. Most likely?", "o": ["A bug", "The published-skills cache (5-minute TTL)", "The judge", "Rate limiting"], "a": 1, "e": ["It is documented behaviour.", "Correct.", "Unrelated.", "Unrelated."]}, {"q": "A skill with no tools and no capabilities was invisible everywhere. Which lifecycle step failed?", "o": ["Writing", "Resolution (binding) — it was never usable", "Publishing", "The model"], "a": 1, "e": ["The text could be fine.", "Correct: AB#180772.", "It was published.", "The model never saw it."]}, {"q": "Why must a header like X-DealerIQ-Eval-Origin-Kind not be what authorises a preview skill?", "o": ["Headers are slow", "Any caller can send a header; a header that grants visibility gives spoofers something — authorisation must come from a verified claim", "Headers are logged", "It is not documented"], "a": 1, "e": ["Speed is irrelevant.", "Correct: DAC decision D5.", "Logging is not the issue.", "It is explicitly decided."]}, {"q": "GPT-4o and GPT-4.1 retire on 2027-01-14. How is the route switch to be proven?", "o": ["Trust the vendor", "Console-authored eval cases compared across models (RM-27)", "A user survey", "Load testing only"], "a": 1, "e": ["Not evidence.", "Correct.", "Not systematic.", "Quality is the question."]}, {"q": "An operator types an allow rule into a DAC policy screen for a tool config does not permit. What happens?", "o": ["Access is granted", "Nothing — policy may only narrow what structure permits", "It needs a deploy", "It grants on DEV only"], "a": 1, "e": ["The narrowing rule prevents it.", "Correct.", "Policy changes take seconds; grants beyond config are impossible.", "Same everywhere."]}], "ex": {"task": "<p>Write the end-to-end path for one real Yaksha question you have seen in Chat sessions. For each hop, write: the component, what it received, what it returned, what could fail, and where you would see the evidence (screen or log).<\/p>", "checks": ["Each hop names exactly one component", "Every failure has a screen or log where it would be visible", "You noted the environment and model", "You marked anything you could not confirm as “to verify”"], "ref": "<p>Example (structure, not facts about a specific session): <b>Dealer → Yaksha<\/b> (question text; could be ambiguous) → <b>Gateway<\/b> (context assembly; 429 under load) → <b>TargetMCP tool<\/b> (arguments; wrong dealer scope, schema error) → <b>model<\/b> (answer; ungrounded claim) → <b>session record<\/b> (visible in Chat sessions and Eval Review). Environment: DEV. Model: as shown in the session.<\/p>"}}, "27.02": {"s": [{"id": "idea", "t": "A skill is software — test it like software", "tag": "v", "h": "<p>A skill is a folder: <code>SKILL.md<\/code> with a short name and description, then instructions, plus optional references, scripts and assets. Anthropic describes skills as modular capabilities packaging instructions, metadata and resources, used automatically when relevant. The new twist for a tester: the same input can produce a different output every run. So you report <b>rates over repeated trials<\/b>, and some expected results are a <b>rubric<\/b> rather than an exact value.<\/p>"}, {"id": "levels", "t": "How a skill loads — and why each level can fail", "tag": "v", "h": "<table><tr><th>Level<\/th><th>What loads<\/th><th>When<\/th><th>Fails how<\/th><\/tr>\n<tr><td>1<\/td><td>Name and description (~100 tokens)<\/td><td>Always, at startup<\/td><td>Vague or overlapping description → never chosen, or chosen wrongly<\/td><\/tr>\n<tr><td>2<\/td><td>SKILL.md body (under 5,000 tokens)<\/td><td>When triggered<\/td><td>Instructions ignored, contradictory or too long<\/td><\/tr>\n<tr><td>3<\/td><td>References, scripts (only their output)<\/td><td>As needed<\/td><td>File missing, wrong path, script error<\/td><\/tr><\/table>\n<div class=\"callout\">This is the progressive-disclosure model documented for Anthropic Agent Skills. DealerIQ skills are published in DAC and called via the Gateway; confirm how DealerIQ loads references before testing level 3.<\/div>"}, {"id": "four", "t": "The four tests every skill needs", "tag": "v", "h": "<ol><li><b>Spec check<\/b> — is the package valid? Static checks on SKILL.md: name format, description length, a “when to use” clause, body size. Cheap and deterministic; run on every change.<\/li>\n<li><b>Trigger test<\/b> — does it fire at the right time? Should-fire and should-not-fire queries, including near-misses; each run counted; precision, recall, false-positive rate. Repeat with your other skills loaded.<\/li>\n<li><b>Uplift test<\/b> — is it better than nothing? Same tasks with and without the skill (or vs the previous version), same model, same graders. The value is the difference. Zero difference → delete the skill.<\/li>\n<li><b>Reliability test<\/b> — does it work every time? Repeat trials, report pass^k.<\/li><\/ol>\n<p>Passing one tells you nothing about the others. A perfect skill that never triggers is worth zero.<\/p><div class=\"callout warn\"><b>Cross-cutting rule:<\/b> the author of a skill must not be its grader (Anthropic’s enterprise guidance).<\/div>"}, {"id": "lint", "t": "Test 1 — lint a real SKILL.md", "tag": "v", "h": "<div data-w=\"lint\"><\/div><p class=\"small\">Notice the DealerIQ-specific fields (<code>completion-enabled<\/code>, <code>category<\/code>, <code>surfaces<\/code>). Your handover warns to type them as plain lines and check they survive the DAC save.<\/p>"}, {"id": "trigger", "t": "Test 2 — triggering, the DealerIQ way", "tag": "v", "h": "<p>This is where DealerIQ differs from Claude’s Agent Skills, and it changes how you test. In the Gateway, <b>skill matching is pure lexical keyword and substring matching — no LLM, no embeddings<\/b> (TargetMCP <code>SKILL_RESOLUTION.md<\/code>). Every chat request runs all loaded skills through a funnel; a skill reaches the prompt only if it survives every gate:<\/p>\n<table><tr><th>Gate<\/th><th>Question<\/th><th>Silent drop?<\/th><\/tr><tr><td>0<\/td><td>Portal persona — is the skill persona-allowed? (empty <code>personas<\/code> = dealer staff only)<\/td><td><\/td><\/tr><tr><td>1<\/td><td>Is it visible to this <b>consumer<\/b> (the calling app, resolved server-side)? Empty list = visible to all; a null consumer fails a non-empty list<\/td><td>yes<\/td><\/tr><tr><td>2<\/td><td>Did the message <b>trigger<\/b> it? score ≥ <b>0.30<\/b> (bypassed by <code>auto-load: true<\/code>)<\/td><td>yes<\/td><\/tr><tr><td>3<\/td><td>Top-N cap: <b>MaxSkillsPerRequest = 2<\/b>; auto-load takes slots first<\/td><td><\/td><\/tr><tr><td>4<\/td><td>Can it <b>bind<\/b>? tools and capabilities resolve, dms-type allowed, UMH content present<\/td><td>yes<\/td><\/tr><\/table>\n<p><b>The score:<\/b> <code>0.7 × trigger + 0.3 × description + 0.2 × context<\/code>, capped at 1.0. A full <code>triggers:<\/code> phrase in the message scores about 0.56–0.70 and clears the bar alone; half the trigger words score about 0.21 and are dropped; description overlap is worth about 0.03; page/entity context adds 0.2 only if the app sends <code>AppContext<\/code>.<\/p>\n<div data-w=\"skillscore\"><\/div>\n<div class=\"callout\"><b>What this means for your tests.<\/b> Because matching is deterministic, the same message always gets the same routing decision — you do not need repeated runs to measure triggering. Instead, test <b>phrasing coverage<\/b>: real dealer wordings that should fire, near-misses that share words but should not, and the silent gates (consumer, dms-type, unresolved tools). Repeated runs are still needed for what the <i>model<\/i> does after the skill is injected. Turn on <code>Skills:VerboseLogging<\/code> in the Gateway to see which gate dropped a skill.<\/div>\n<p class=\"small\">Two more limits from the Gateway defaults: skill bodies are truncated past <b>MaxSkillTokens = 1,500<\/b> tokens, and system skills are cached for 5 minutes (matching your handover’s “skills refresh every 5 min”). Completion skills such as promise detection are called by name on <code>/api/completions-fast<\/code>, so this funnel does not apply to them.<\/p><div data-w=\"trig\"><\/div><p class=\"small muted\">Source: TargetMCP repo (Ideal Agile), branch main, commit 6659654 — read on 2026-10-25.<\/p>"}, {"id": "uplift", "t": "Test 3 — uplift with an interval", "tag": "v", "h": "<p>For each task, compute the with-skill pass rate minus the baseline pass rate; average those differences; the standard error is the standard deviation of the differences ÷ √(number of tasks); the 95% interval uses a t value because task counts are small. If the whole interval is above zero, uplift is supported. If it includes zero, it may be noise (Miller, <i>Adding Error Bars to Evals<\/i>).<\/p><div data-w=\"uplift\"><\/div>"}, {"id": "rel", "t": "Test 4 — reliability", "tag": "v", "h": "<p><b>pass@k<\/b> = 1 − (1 − p)^k: the chance at least one of k attempts succeeds — right when a person keeps the best attempt. <b>pass^k<\/b> = p^k: the chance every run succeeds — right when nobody checks each run, which is the case for CRM workflows. At p = 0.75 and k = 3, pass^k ≈ 42%: a “75% good” skill gives three users in a row a correct result less than half the time.<\/p><div data-w=\"rel\"><\/div>"}, {"id": "gates", "t": "How the four tests map to release gates", "tag": "v", "h": "<table><tr><th>Anthropic gate<\/th><th>Checks<\/th><th>Your test<\/th><\/tr><tr><td>Triggering accuracy<\/td><td>Fires on the right queries only<\/td><td>2<\/td><\/tr><tr><td>Isolation<\/td><td>Works when it is the only skill<\/td><td>3, 4<\/td><\/tr><tr><td>Coexistence<\/td><td>Doesn’t break or get broken by other skills<\/td><td>2 with all skills loaded<\/td><\/tr><tr><td>Instruction following<\/td><td>Follows its own SKILL.md<\/td><td>3 with code assertions<\/td><\/tr><tr><td>Output quality<\/td><td>Result is correct and useful<\/td><td>3 with rubric graders<\/td><\/tr><\/table>\n<p>Also test across model tiers — a skill that works on one model may fail on another. Evidence that the effort pays: SkillsBench measured average pass rate rising from 33.9% to 50.5% with curated skills, but the gain ranged from +4.1 to +25.7 points by setup — only a paired measurement tells you which case you are in.<\/p>"}], "quiz": [{"q": "A skill’s outputs are perfect, but it fires on 2 of 30 should-fire runs. Its value is…", "o": ["High — the output is perfect", "Close to zero until triggering is fixed", "Unknowable", "Measured by pass@k"], "a": 1, "e": ["Output quality only matters when the skill runs.", "Correct: a skill that rarely triggers delivers almost nothing.", "You know enough to act: fix the description.", "pass@k is about repeated attempts, not routing."]}, {"q": "Baseline passes 1/3 and with-skill 3/3 on one task. What do you need before claiming uplift?", "o": ["Nothing — 100% vs 33%", "More tasks and an interval that excludes zero", "A judge", "A larger model"], "a": 1, "e": ["One task cannot support a general claim.", "Correct: average paired differences across tasks and check the interval.", "Graders matter, but the sample size is the gap here.", "Model choice is a separate experiment."]}, {"q": "Which reliability number fits an unattended CRM workflow?", "o": ["pass@k", "pass^k", "F1", "Accuracy"], "a": 1, "e": ["pass@k assumes someone picks the best attempt.", "Correct: every run must succeed because nobody reviews each one.", "F1 balances precision and recall; it says nothing about repeated runs.", "Accuracy ignores run-to-run consistency."]}, {"q": "A Yaksha skill never fires for “what’s my shop doing this week”. Its trigger is “service schedule”. Most likely gate?", "o": ["Gate 2: lexical miss — the message doesn’t contain the trigger phrase", "Gate 4: dms-type", "The model chose not to use it", "Gate 3: too many skills"], "a": 0, "e": ["Correct: matching is lexical; broaden triggers to real phrasing.", "Possible, but a phrasing miss is the most common cause per the repo’s troubleshooting order.", "No model is involved in DealerIQ skill matching.", "Only relevant when two higher-scoring skills matched."]}, {"q": "Do you need repeated runs to measure whether a DealerIQ chat skill triggers?", "o": ["Yes, always", "No — routing is deterministic lexical matching; repeat runs measure the model’s behaviour after injection", "Only on PROD", "Only for auto-load skills"], "a": 1, "e": ["Routing has no randomness in DealerIQ.", "Correct.", "Environment doesn’t change the scoring rule.", "auto-load bypasses scoring entirely."]}], "ex": {"task": "<p>Pick one DealerIQ skill. Write its five-line contract: what it does, when it should run, inputs, what good output means, what it must never do. If you can’t fit it in five lines, the skill is too broad. Then list 10 should-fire and 10 near-miss queries (skip this half if the skill is called by name), and 6 uplift tasks with one code assertion each.<\/p>", "checks": ["Contract fits in five lines", "Near-misses share words with the skill but belong elsewhere", "At least 8 queries are marked held-out", "Each uplift task has an assertion code can check"], "ref": "<p><b>Contract (crm-promise-detection):<\/b> Reads one SMS conversation and returns JSON listing promises not kept and requests not answered. Runs when TargetCRM sends a conversation with new messages. Input: facts in the system message, transcript in the user message. Good: every owed item found, nothing invented, ids copied exactly, enums valid. Never: invent prices, stock or dates; treat System lines as promises.<br><b>Uplift tasks with assertions:<\/b> T05 nothing owed → <code>obligations is []<\/code>; T07 “let me check” → no UnansweredRequest; T10 broadcast → <code>obligations is []<\/code>; T09 repeated promise → source is the first message; T13 fresh promise → urgency Low, RemindRep; T02 kept promise → fulfilled true.<\/p>"}}, "27.03": {"s": [{"id": "what", "t": "What the skill does — and what it must not do", "tag": "v", "h": "<p><code>crm-promise-detection<\/code> (v4) reads <b>one<\/b> customer SMS conversation and returns, as JSON only, everything the dealership still owes the customer: <b>promises<\/b> an employee made and did not keep, and customer <b>requests<\/b> nobody answered. For each item it rates urgency, explains why it was flagged, suggests a next step and drafts a reply. It also describes how the customer feels. It is a single-shot completion skill, not chat. Model: <code>gpt-5.4-mini<\/code>; stored in <code>Customers.CustomerSentimentObligation<\/code>.<\/p>\n<p>It must <b>never invent<\/b> dealer, rep, unit, price, stock or customer details that are not in the conversation, and System lines (Broadcast, Survey, Automation, Payment) are never promises — except a Payment message can deliver a promised payment link.<\/p>"}, {"id": "contract", "t": "The request contract", "tag": "v", "h": "<pre><code>POST {gateway}/api/completions-fast\n{\n  \"skill\": \"crm-promise-detection\",\n  \"dms_type\": \"Ideal\",\n  \"messages\": [\n    { \"role\": \"system\", \"content\": \"Dealer: Riverbend Powersports\\nDepartment: Service\\nCustomer: Lena Park\\nConversation: 48213\\nTime zone: Central (America/Chicago)\\nNow: 2026-10-23T09:00:00-05:00\" },\n    { \"role\": \"user\", \"content\": \"[91844934] 2026-09-25T08:32:00-05:00 Rep (Sarah): I'll send over a digital copy of the owner's manual.\\n[91844935] 2026-09-27T08:32:00-05:00 Customer: Still waiting on the owner's manual you mentioned.\" }\n  ]\n}<\/code><\/pre>\n<p>Facts go in the system message; the transcript goes in the user message, one line per message: <code>[MessageId] ISO-timestamp sender: text<\/code>. Sender is <code>Customer<\/code>, <code>Rep (Name)<\/code> or <code>Rep<\/code>, or <code>System (kind)<\/code>. Send names, never user ids — CRM traces results back through message ids. Use the signed-in user’s IDMS token.<\/p>"}, {"id": "schema", "t": "The response schema, field by field", "tag": "v", "h": "<table><tr><th>Field<\/th><th>Meaning<\/th><th>Allowed values / rule<\/th><\/tr>\n<tr><td>conversationId<\/td><td>Echo of the Conversation value<\/td><td>Must equal what CRM sent<\/td><\/tr>\n<tr><td>obligationType<\/td><td>Kind of item<\/td><td>Promise | UnansweredRequest<\/td><\/tr>\n<tr><td>sourceMessageId, sourceQuote<\/td><td>Message that created the item, exact words<\/td><td>Promise → a Rep line; request → a Customer line; never System<\/td><\/tr>\n<tr><td>promisedBy<\/td><td>Rep name from the promise line<\/td><td>\"\" for requests or unnamed reps<\/td><\/tr>\n<tr><td>owedItem / owedCategory<\/td><td>Short title / category<\/td><td>One of 10: TradeValuation, FinanceApproval, CashQuote, SpecSheet, OwnersManual, ServiceEstimate, PartsAvailability, UnitAvailability, Callback, GeneralInquiry<\/td><\/tr>\n<tr><td>fulfilled, fulfillmentEvidence<\/td><td>Closed or not; id + quote of the fulfilling message<\/td><td>Requests are always false<\/td><\/tr>\n<tr><td>customerChaseMessageId / Count<\/td><td>Latest chase and how many<\/td><td>Count 0 exactly when the id is \"\"<\/td><\/tr>\n<tr><td>urgency, urgencyReason<\/td><td>Ladder and the signal that set it<\/td><td>Critical | High | Medium | Low; \"\" when fulfilled<\/td><\/tr>\n<tr><td>whyFlagged, reasoning<\/td><td>One sentence; 2–4 reasons<\/td><td>whyFlagged \"\" when fulfilled<\/td><\/tr>\n<tr><td>confidence<\/td><td>0–1 that it is really owed<\/td><td>Below 0.6 is left out (CRM drops it)<\/td><\/tr>\n<tr><td>suggestedActionType / Action / Reply<\/td><td>CRM button, instruction, SMS draft<\/td><td>SendReply | CreateTask | RemindRep; reply under 320 characters; all \"\" when fulfilled<\/td><\/tr><\/table>"}, {"id": "rules", "t": "The rules the model can get wrong", "tag": "v", "h": "<ul><li><b>Promise<\/b> = an employee committing to a specific future action for this customer, including agreeing to a request (“Sure!”). Not greetings, courtesy, facts, questions to the customer, or the customer’s own promises.<\/li>\n<li><b>Fulfilled<\/b> only when a later employee message delivers it or clearly closes it. “Still working on it” does not. Customer withdrew → fulfilled, with evidence. Silence or a change of subject is not delivery.<\/li>\n<li><b>Unanswered request<\/b> = a customer question or ask with no later answer. A reply to a different question does not count. If the rep replied “let me check”, report a <b>Promise<\/b>, not a request — never both.<\/li>\n<li><b>Repeats<\/b> are reported once, against the first open message, with the repeat noted in reasoning.<\/li>\n<li><b>Urgency<\/b> — highest signal wins, waiting time from source to Now. Critical: ≥14 days, angry or leaving, chased 3+, deadline passed or within 24 h. High: ≥7 days, frustrated or cites a competitor, chased twice, deadline in days, a sale waits on it. Medium: ≥48 h, concerned, chased once. Low: none.<\/li>\n<li><b>Next step<\/b> — SendReply is the default (waiting, chased, High/Critical); CreateTask when work must happen first and it is Medium/Low; RemindRep for a named-rep Promise, Low, no chase.<\/li><\/ul>"}, {"id": "metrics", "t": "Which metrics, and why", "tag": "d", "h": "<p>This is a <b>detection<\/b> problem first and a <b>field-accuracy<\/b> problem second. Measure both levels:<\/p>\n<ol><li><b>Schema validity<\/b> — share of responses that pass the CRM validator (next section). A response that fails is lost work.<\/li>\n<li><b>Item detection<\/b> — compare predicted items with your labelled items, matched on <code>sourceMessageId<\/code>. TP = a real item found; FP = an item reported that is not owed (noise in the manager’s queue); FN = a real item missed (a customer left waiting).<\/li>\n<li><b>Per class<\/b> — compute precision and recall separately for Promise and UnansweredRequest. An average can hide that one class is weak.<\/li>\n<li><b>Per field<\/b> — on matched items only: exact-match accuracy for owedCategory, urgency, suggestedActionType, fulfilled, customerChaseCount.<\/li>\n<li><b>Free text<\/b> — whyFlagged and suggestedReply need a judge with binary criteria (lesson 27.05).<\/li><\/ol>\n<div class=\"callout warn\"><b>Accuracy is the wrong headline here.<\/b> Most conversations owe nothing (in your scan data, 63% of threads are broadcast-only), so a skill that always returns <code>[]<\/code> scores high accuracy and zero recall.<\/div><div data-w=\"prf\"><\/div>"}, {"id": "validate", "t": "Validate like CRM does", "tag": "v", "h": "<p>CRM checks every response before saving: strip a code fence, parse; conversationId must match; reject if <code>completion_tokens ≥ 4000<\/code> (cut off); every id must exist in the transcript; Promise source a Rep line, request source a Customer line, System never a source; enums valid; fulfilled items have empty urgency/why/next-step fields; chase count 0 exactly when there is no chase id; drop items with confidence &lt; 0.6, then upsert on (ConversationId, SourceMessageId). Run the checks yourself:<\/p><div data-w=\"validator\"><\/div>"}, {"id": "tests", "t": "The 14 planned DAC tests and the rule each guards", "tag": "v", "h": "<table><tr><th>#<\/th><th>Test<\/th><th>Rule it guards<\/th><th>Must see<\/th><\/tr>\n<tr><td>T01<\/td><td>Broken promise, chased<\/td><td>No later delivery = owed; JSON only; ids copied<\/td><td>Promise from 92000102, chased in 92000103<\/td><\/tr>\n<tr><td>T02<\/td><td>Promise kept<\/td><td>A later delivery fulfils it<\/td><td>fulfilled true, evidence 92000203<\/td><\/tr>\n<tr><td>T03<\/td><td>“Still working on it”<\/td><td>A vague check-in does not fulfil<\/td><td>Still open, High or worse after 9 days<\/td><\/tr>\n<tr><td>T04<\/td><td>Customer withdrew<\/td><td>“Never mind” closes the promise<\/td><td>fulfilled true, evidence 92000403<\/td><\/tr>\n<tr><td>T05<\/td><td>Nothing owed<\/td><td>Answered question → nothing<\/td><td>obligations is []<\/td><\/tr>\n<tr><td>T06<\/td><td>Question nobody answered<\/td><td>Reply to another question is not an answer<\/td><td>UnansweredRequest from 92000601<\/td><\/tr>\n<tr><td>T07<\/td><td>“Let me check”<\/td><td>Commitment becomes a Promise, never both<\/td><td>Promise from 92000702, no request<\/td><\/tr>\n<tr><td>T08<\/td><td>“Sure!”<\/td><td>Agreeing is the promise<\/td><td>Promise from 92000802 by Sarah<\/td><\/tr>\n<tr><td>T09<\/td><td>Same promise twice<\/td><td>Report once, against the first<\/td><td>Source 92000902, Critical, chased 2×<\/td><\/tr>\n<tr><td>T10<\/td><td>Broadcast<\/td><td>System lines are context only<\/td><td>obligations is []<\/td><\/tr>\n<tr><td>T11<\/td><td>Deadline passed<\/td><td>Passed deadline → Critical<\/td><td>FinanceApproval, Critical<\/td><\/tr>\n<tr><td>T12<\/td><td>Competitor quote<\/td><td>Competitor offer → at least High<\/td><td>CashQuote, no price in reply<\/td><\/tr>\n<tr><td>T13<\/td><td>Fresh promise<\/td><td>Under 48 h, calm → Low, RemindRep<\/td><td>Low, RemindRep<\/td><\/tr>\n<tr><td>T14<\/td><td>Payment link delivered<\/td><td>Payment line can deliver<\/td><td>fulfilled true, evidence 92001403<\/td><\/tr><\/table>\n<p>Each test has exact JSON checks plus a yes/no judge for meaning. Run them against the saved v4 draft — the published v3 fails most of them, which is expected. A live DAC run takes 5 cases, so 14 tests is 3 runs, inside DEV’s $5 a day.<\/p><div class=\"callout\">These 14 are <b>rule tests<\/b>: one per rule. They prove the skill can follow each rule once. They are not a <b>performance<\/b> estimate — for that you need the representative dataset in 27.04, with repeated trials.<\/div>"}, {"id": "fail", "t": "Interpreting failures", "tag": "d", "h": "<table><tr><th>What you see<\/th><th>Likely cause<\/th><th>Action<\/th><\/tr><tr><td>Validator rejects (bad id, enum)<\/td><td>Model ignored format rules<\/td><td>Tighten the output section; add the case; consider structured outputs if the gateway supports them<\/td><\/tr><tr><td>FP on fulfilled promises<\/td><td>Fulfilment rule misread<\/td><td>Add T02/T04-style cases; check reasoning text<\/td><\/tr><tr><td>FN on “Sure!”<\/td><td>Agreement not recognized as promise<\/td><td>Add more agreement variants to the dataset<\/td><\/tr><tr><td>Urgency too low<\/td><td>Signal missed (chases, deadline)<\/td><td>Per-signal cases; compare urgencyReason<\/td><\/tr><tr><td>Reply states a price<\/td><td>Invented the owed thing<\/td><td>Critical failure: block release (T12)<\/td><\/tr><\/table>"}], "quiz": [{"q": "The rep wrote “let me check and get back to you” to a stock question. Correct output?", "o": ["One UnansweredRequest", "One Promise", "Both a Promise and a request", "Nothing"], "a": 1, "e": ["The question was answered with a commitment, so it is not unanswered.", "Correct (T07): the commitment becomes a Promise, never both.", "The rule says never both.", "Something is owed: the answer that was promised."]}, {"q": "A skill returns [] for every conversation. On a dataset where 70% owe nothing, its accuracy and recall are…", "o": ["70% and 70%", "70% and 0%", "0% and 0%", "100% and 0%"], "a": 1, "e": ["Recall measures found real items; it found none.", "Correct: accuracy rewards the many negatives while recall shows it misses everything.", "It is right on all the empty cases.", "It is wrong on every case that owes something."]}, {"q": "An item has confidence 0.55. What does CRM do?", "o": ["Rejects the whole response", "Drops that item, keeps the rest", "Saves it as Low urgency", "Asks the model again"], "a": 1, "e": ["Only cut-off, unparsable or invalid responses are rejected whole.", "Correct: items under 0.6 are dropped before the upsert.", "Urgency is not changed by CRM for this.", "There is no retry for low confidence."]}, {"q": "Why are the 14 DAC tests not enough to say the skill is 90% accurate?", "o": ["They use the wrong model", "They are one case per rule, not a representative sample", "They have no judge", "They run on PROD"], "a": 1, "e": ["The model is the right one.", "Correct: rule tests prove coverage of rules, not performance on real traffic.", "They do have judges.", "They run in DEV."]}, {"q": "The reply says “we can do $23,900” in T12. How do you classify it?", "o": ["Minor tone issue", "Critical failure: the owed thing was invented", "Pass, it answers the customer", "Schema error"], "a": 1, "e": ["Inventing a price is not a tone issue.", "Correct: the skill must never invent the owed thing itself.", "It answers with a fabricated number.", "The JSON can be valid and still fail this rule."]}], "ex": {"task": "<p>Take T06 and T07 from the table. For each, write: the expected JSON items (type, sourceMessageId, category), two exact assertions, and one yes/no judge criterion. Then paste the verified Maria example into the checker above, break it in two different ways, and note which checks caught each break.<\/p>", "checks": ["Assertions reference ids, not wording", "Judge criteria are yes/no", "You broke it in two independent ways", "You recorded which rule caught each"], "ref": "<p><b>T06:<\/b> one UnansweredRequest, source 92000601, category UnitAvailability, chase 92000603. Assertions: <code>obligationType == UnansweredRequest<\/code>; <code>promisedBy == \"\"<\/code>. Judge: “The reply does not claim the unit is or isn’t in stock.”<br><b>T07:<\/b> one Promise, source 92000702, PartsAvailability. Assertions: <code>obligationType == Promise<\/code>; <code>never UnansweredRequest<\/code>. Judge: “Does not also report the question as unanswered.”<\/p>"}}, "27.04": {"s": [{"id": "why", "t": "The dataset is the work", "tag": "v", "h": "<p>The harness is the easy part; nobody publishes a dataset for your CRM. You build it from your own conversations and real failures. A representative golden dataset is what turns “it passed 14 rule tests” into “it finds 88% of owed items on real traffic”.<\/p>"}, {"id": "rules", "t": "Rules that keep a dataset honest", "tag": "v", "h": "<ul><li>Start with 20–50 tasks drawn from <b>real failures<\/b>, not imagined ones.<\/li><li>Two experts must reach the same verdict independently. If they would argue, the case is ambiguous — fix the case before you fix the skill.<\/li><li><b>Balance it<\/b>: cases where the skill should act and where it should not. One-sided evals create one-sided optimization.<\/li><li>Keep a <b>held-out test split<\/b> you never use while tuning.<\/li><li>Never invent business rules in the expected result; flag gaps instead of guessing.<\/li><li>Every production bug becomes a new case tagged <code>regression<\/code>.<\/li><\/ul>"}, {"id": "sample", "t": "Sampling from TargetCRM, using real proportions", "tag": "v", "h": "<p>Your scan data shows that of 6.36M non-archived threads only ~2.25M (35.3%) are real two-way conversations; 4.01M (63.1%) are broadcast or automated only and 96.7k (1.5%) are empty. The skill reads only two-way threads, so sample from those — but keep a few broadcast-only threads as negative cases (T10 shows why).<\/p><p>Messages average about 5.84 per conversation and 187 characters each. Among recent messages, ~72% are System lines (Broadcast, Survey, Automation, Payment): System lines are cut to 200 characters and only Customer and Rep lines count toward the transcript limit.<\/p>\n<p><b>Stratify<\/b> so averages cannot hide a weak segment: by dealer size (top, median, small), department (Sales, Service, Parts), and outcome (owes nothing / one promise / one request / several / fulfilled). A starting target: 150 conversations, at least 20 per outcome group.<\/p>"}, {"id": "pii", "t": "PII and handling", "tag": "d", "h": "<p>Conversations contain names, phone numbers and possibly payment details. Before a case enters the dataset: replace names with consistent placeholders, remove phone numbers and emails, never copy payment data. Keep message ids and timestamps — the checks depend on them. Store the dataset where your team’s data policy allows, and log only response id, status and error code, never message text (as your handover requires for CRM).<\/p>"}, {"id": "label", "t": "Labelling guideline", "tag": "d", "h": "<p>Write the guideline before labelling. For each conversation the labeller records every owed item with: type, sourceMessageId, category, fulfilled, chase count, urgency. Include the rule text from the skill for each field, and worked examples from T01–T14. Mark a case <code>ambiguous<\/code> when the rules do not decide it — those go to discussion, not into the score.<\/p>"}, {"id": "agree", "t": "Measuring agreement", "tag": "v", "h": "<p>Two people label the same 40 conversations independently. Raw agreement is inflated by easy cases, so use <b>Cohen’s kappa<\/b>, which corrects for chance: κ = (pₒ − pₑ) ÷ (1 − pₑ). This roadmap uses κ ≥ 0.6 as a working bar — a rule of thumb, not a standard. Below it, the guideline is ambiguous: fix the wording and relabel.<\/p><div data-w=\"kappa\"><\/div><p class=\"small\">Expect criteria to change after you read real outputs (“criteria drift”, Shankar et al.). Re-check agreement each time the guideline changes.<\/p>"}, {"id": "format", "t": "Storing the dataset", "tag": "d", "h": "<pre><code>{\"id\":\"cd-0001\",\"split\":\"dev\",\"stratum\":\"service/median/one-promise\",\n \"system\":\"Dealer: …\\nConversation: 50101\\n…\",\"transcript\":\"[92000101] … Rep (Sarah): …\",\n \"expected\":[{\"obligationType\":\"Promise\",\"sourceMessageId\":\"92000102\",\"owedCategory\":\"OwnersManual\",\n   \"fulfilled\":false,\"customerChaseCount\":1,\"urgency\":\"Medium\"}],\n \"labels\":{\"by\":[\"A\",\"B\"],\"kappa_batch\":\"2026-11-14\"},\"tags\":[]}<\/code><\/pre><p>One JSON object per line (JSONL) is the format most eval harnesses accept. Version the file next to the skill.<\/p>"}], "quiz": [{"q": "Two raters agree on 85% of cases, but chance agreement is 70%. What is kappa?", "o": ["0.85", "0.50", "0.15", "0.70"], "a": 1, "e": ["That is raw agreement.", "Correct: (0.85 − 0.70) ÷ (1 − 0.70) = 0.50.", "That is the difference, not divided by (1 − pₑ).", "That is chance agreement."]}, {"q": "Why keep some broadcast-only threads in the dataset?", "o": ["To raise accuracy", "As negative cases: the skill must return nothing for them", "Because they are 63% of threads", "They should not be included at all"], "a": 1, "e": ["Accuracy is not the goal.", "Correct: T10 tests exactly this failure.", "Proportion alone is not the reason — the skill skips them in production.", "A few negatives are needed to catch false positives."]}, {"q": "Raters disagree on whether a vague “I’ll look into it” is a promise. What do you do?", "o": ["Pick one and move on", "Mark it ambiguous and fix the guideline", "Ask the model", "Delete the conversation"], "a": 1, "e": ["Guessing builds noise into ground truth.", "Correct: ambiguity is a guideline problem first.", "The model is what you are testing.", "You lose a useful edge case."]}], "ex": {"task": "<p>Design the stratification for 150 conversations: list each stratum, its target count and why it is there. Then write the first three lines of your labelling guideline for “fulfilled”.<\/p>", "checks": ["Strata cover size, department and outcome", "Negative cases are included", "Guideline quotes the skill’s rule text", "An ambiguous route exists"], "ref": "<p>Example: 30 owes-nothing (incl. 8 broadcast-only), 40 one-promise, 30 one-request, 25 several items, 25 fulfilled/withdrawn; spread across Sales/Service/Parts and top/median/small dealers. Guideline: “Fulfilled = a later employee message delivers the item or clearly closes it. ‘Still working on it’ is not fulfilment. Customer withdrew → fulfilled with evidence. If unsure, mark ambiguous.”<\/p>"}}, "27.05": {"s": [{"id": "why", "t": "Why free text needs a judge", "tag": "a", "h": "<p><code>whyFlagged<\/code>, <code>reasoning<\/code> and <code>suggestedReply<\/code> are free text: many different wordings are correct. Exact-match fails them all. A judge — an LLM asked yes/no questions about the output — can grade meaning. But a judge is itself a model: before you trust its verdicts, you measure how often it agrees with people.<\/p>"}, {"id": "criteria", "t": "Binary criteria from the skill’s own rules", "tag": "v", "h": "<p>Turn each written rule into a yes/no question. From the v4 skill text:<\/p><table><tr><th>Field<\/th><th>Criterion (yes = pass)<\/th><\/tr>\n<tr><td>suggestedReply<\/td><td>Under 320 characters, plain text, no emojis, no links unless one is in the thread<\/td><\/tr>\n<tr><td>suggestedReply<\/td><td>Does not invent the owed thing (price, approval, number, stock, date not already in the thread)<\/td><\/tr>\n<tr><td>suggestedReply<\/td><td>Uses the customer’s first name if known and commits to when the rep will reply<\/td><\/tr>\n<tr><td>suggestedReply<\/td><td>Matches the customer’s mood (more apology when frustrated)<\/td><\/tr>\n<tr><td>whyFlagged<\/td><td>One plain sentence naming what is owed, who promised or asked, and what happened since<\/td><\/tr>\n<tr><td>reasoning<\/td><td>2–4 reasons, each supported by the transcript<\/td><\/tr><\/table>\n<p>Some of these are code checks (length, emojis, links); only the rest go to the judge. DAC judges are yes/no today (score 0 or 1).<\/p>"}, {"id": "dqjudge", "t": "DealerIQ’s judge, as configured", "tag": "v", "h": "<ul><li>Default judge model <b>gpt-5.4-mini<\/b> (openai / azure-openai) or <b>claude-haiku-4-5<\/b> (anthropic). DEV and TEST drains use Azure OpenAI deployment <code>gw-chat-gpt-5.4-mini<\/code>.<\/li>\n<li>Measured on 146 labelled judgements (2026-10-05, Evals #108): gpt-4o-mini agreed <b>92.7%<\/b>, gpt-5.4-mini <b>98.4%<\/b>, gpt-5.4 <b>99.3%<\/b>. That is the calibration evidence for the current choice.<\/li>\n<li>The judge grades <b>answer quality only<\/b>; tool rules are judged only by deterministic tool checks (owner decision, Evals #103).<\/li>\n<li><b>Reported-model check:<\/b> if the provider reports a different model, or none, the verdict is thrown away and the case counts as <i>incomplete<\/i>, not failed.<\/li>\n<li>Without a judge, answer quality is <b>ungraded<\/b> — absent, not zero.<\/li>\n<li>A <code>judge<\/code> grader with <code>mode: reference_guided<\/code> takes yes/no criteria; its score is criteria met ÷ criteria.<\/li><\/ul><p class=\"small muted\">Source: TargetMCP repo (Ideal Agile), branch main (doc dated 2026-10-06) — read on 2026-10-25.<\/p>"}, {"id": "calib", "t": "Calibrating the judge", "tag": "v", "h": "<p>A person grades a sample; the judge grades the same outputs. Raw agreement is not enough. What matters most is how many <b>human-failed<\/b> outputs the judge lets through — that is a bad draft reaching a manager.<\/p><ul><li><b>TPR<\/b> (true positive rate) = of outputs humans passed, share the judge passed.<\/li><li><b>TNR<\/b> (true negative rate) = of outputs humans failed, share the judge failed. This is the safety number.<\/li><\/ul><p>Research: strong LLM judges reached over 80% agreement with human preferences, about the rate humans agree with each other — but showed position, verbosity and self-enhancement bias (Zheng et al.).<\/p><div data-w=\"prf\" data-c='{\"tp\":26,\"fp\":3,\"fn\":4,\"tn\":7}'><\/div><p class=\"small\">Read the calculator with “positive = human pass”: recall is the judge’s TPR; TNR = TN ÷ (TN + FP).<\/p>"}, {"id": "platform", "t": "The platform’s judge (documented)", "tag": "v", "h": "<p>The default judge is <code>gpt-5.4-mini<\/code> (OpenAI and Azure OpenAI) or <code>claude-haiku-4-5<\/code> (Anthropic). A 2026-10-05 trial on 146 labelled judgements measured agreement of 92.7% for gpt-4o-mini, 98.4% for gpt-5.4-mini and 99.3% for gpt-5.4. DEV and TEST drains use Azure OpenAI deployment <code>gw-chat-gpt-5.4-mini<\/code> — check the <code>Using LLM judge:<\/code> line in the run log. If the provider reports a different model, the verdict is discarded and the case counts as <b>incomplete<\/b>, not failed. Judge cost is recorded with a price version.<\/p><div class=\"callout\">Agreement on 146 judgements is strong evidence for the platform’s core criteria. It does <b>not<\/b> calibrate the judge on <i>your<\/i> criteria (invented prices in drafts) — you still measure TPR/TNR on your own labelled sample.<\/div><p class=\"small muted\">Source: TargetMCP repo (Ideal Agile), commit 66596549, read through the ADO connector on 25 Oct 2026 — README, docs/concepts/AUTHN_AND_AUTHZ.md, docs/concepts/EVALUATION_MODES_AND_GRADERS.md (last updated 2026-10-06), src/servers/TargetMCP.Customer/README.md and TargetMCP.Order/README.md (both last_verified 2026-03-28 — check tool lists against code before relying on them).<\/p>"}, {"id": "steps", "t": "Procedure", "tag": "d", "h": "<ol><li>Label 40 drafts by hand against the criteria (include 10+ clearly bad ones).<\/li><li>Run the judge on the same 40.<\/li><li>Compute TPR and TNR. If TNR is low, the judge is too lenient: make criteria more specific, add a failing example to the judge prompt, re-run.<\/li><li>Freeze the judge prompt with a version; recalibrate whenever criteria change.<\/li><li>If it cannot reach your bar, use human review for that criterion instead — that is a valid outcome.<\/li><\/ol>"}, {"id": "bias", "t": "Judge pitfalls", "tag": "a", "h": "<ul><li>Longer drafts look better to judges (verbosity bias) — your length rule counters it.<\/li><li>A judge from the same model family may favour its own style.<\/li><li>Grading several criteria in one question hides which failed — ask one at a time.<\/li><\/ul>"}], "quiz": [{"q": "Which number best tells you a lenient judge is dangerous?", "o": ["TPR", "TNR", "Raw agreement", "F1"], "a": 1, "e": ["TPR tells you good drafts pass.", "Correct: TNR is the share of bad drafts the judge catches.", "Raw agreement can be high while bad drafts slip through.", "F1 blends both and hides the weak side."]}, {"q": "“Reply is under 320 characters” should be graded by…", "o": ["The judge", "Code", "A human", "Nobody"], "a": 1, "e": ["A judge can miscount; code cannot.", "Correct: deterministic checks go to code first.", "Wasteful for a countable rule.", "It is a documented rule."]}, {"q": "After rewriting criteria, what must you do?", "o": ["Nothing", "Recalibrate the judge against fresh human labels", "Switch models", "Delete old labels"], "a": 1, "e": ["Old calibration no longer applies.", "Correct: criteria changed, so agreement must be re-measured.", "Model choice is separate.", "Old labels may still be useful."]}], "ex": {"task": "<p>Write the judge prompt for one criterion: “The reply does not invent the owed thing.” Include the definition, two passing and
