  function go(){ var k=num(el,'[data-k=k]'),n=Math.max(1,num(el,'[data-k=n]')),t=num(el,'[data-k=t]'),m=num(el,'[data-k=m]')||0.05,z=1.96,p=Math.min(1,k/n);
    var den=1+z*z/n, ctr=(p+z*z/(2*n))/den, hw=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/den, lo=Math.max(0,ctr-hw), hi=Math.min(1,ctr+hw), need=Math.ceil(z*z*t*(1-t)/(m*m));
    el.querySelector('.out').innerHTML='<div class="kv"><div><b>'+pct(p)+'</b><span>Observed pass rate k/n</span></div><div><b>'+pct(lo)+' – '+pct(hi)+'</b><span>95% Wilson interval</span></div><div><b>'+need+'</b><span>Cases for ±'+(m*100).toFixed(0)+' pts around '+pct(t)+'</span></div>'+(k===0?'<div><b>≤ '+pct(3/n)+'</b><span>Rule of three: 0 failures in '+n+' → true rate plausibly up to 3/n</span></div>':'')+'</div><div class="callout '+(lo>=t?'ok':'warn')+'" style="margin-top:8px">'+(lo>=t?'The lower bound clears the target: the claim “≥ '+pct(t)+'” is supported.':'The lower bound ('+pct(lo)+') is below the target ('+pct(t)+'): this sample cannot show the target is met.')+'</div>'; }
  el.addEventListener('input',go); go(); };
W.mcnemar=function(el){ el.innerHTML='<h4>McNemar test for paired comparisons</h4><p class="small">Same tasks, two systems. Only disagreements count: b = A passed and B failed; c = A failed and B passed.</p><div class="row"><label>b<input type="number" min="0" data-k="b" value="18"></label><label>c<input type="number" min="0" data-k="c" value="7"></label></div><div class="out"></div>';
  function lgam(x){ var g=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5],y=x,t=x+5.5; t-=(x+0.5)*Math.log(t); var s=1.000000000190015; for(var j=0;j<6;j++) s+=g[j]/++y; return -t+Math.log(2.5066282746310005*s/x); }
  function go(){ var b=Math.round(num(el,'[data-k=b]')),c=Math.round(num(el,'[data-k=c]')),n=b+c,chi=n?Math.pow(Math.abs(b-c)-1,2)/n:0, m=Math.min(b,c), pp=0;
    for(var i=0;i<=m;i++) pp+=Math.exp(lgam(n+1)-lgam(i+1)-lgam(n-i+1)-n*Math.log(2)); pp=Math.min(1,2*pp);
    el.querySelector('.out').innerHTML='<div class="kv"><div><b>'+n+'</b><span>Disagreements (b + c)</span></div><div><b>'+chi.toFixed(2)+'</b><span>χ² with continuity = (|b − c| − 1)² / (b + c)</span></div><div><b>'+(n?pp.toFixed(3):'—')+'</b><span>Exact two-sided p-value</span></div></div><div class="callout '+(pp<0.05?'ok':'warn')+'" style="margin-top:8px">'+(n===0?'No disagreements: the systems behaved identically on these tasks.':pp<0.05?'The split is lopsided enough to call a real difference (p < 0.05).':'Not enough evidence of a difference — run more tasks before deciding.')+'</div>'; }
  el.addEventListener('input',go); go(); };
W.ndcg=function(el){ el.innerHTML='<h4>Retrieval metrics: recall@k, MRR, nDCG</h4><p class="small">Type the graded relevance of each returned result in rank order (3 = perfect, 2 = good, 1 = partial, 0 = useless), and how many relevant chunks exist in total.</p><div class="row"><label>Relevance by rank<input type="text" data-k="r" value="3, 0, 2, 0, 1"></label><label>Relevant chunks in the qrels<input type="number" min="1" data-k="tot" value="3"></label></div><div class="out"></div>';

W.kvcache=function(el){ el.innerHTML='<h4>KV cache memory and call latency</h4><div class="row"><label>Layers<input type="number" data-k="L" value="32"></label><label>KV heads<input type="number" data-k="h" value="8"></label><label>Head size<input type="number" data-k="d" value="128"></label><label>Bytes per number<input type="number" data-k="b" value="2"></label><label>Context tokens<input type="number" data-k="t" value="7600"></label></div><div class="row" style="margin-top:6px"><label>Prefill speed tok/s<input type="number" data-k="ps" value="5000"></label><label>Output tokens<input type="number" data-k="o" value="400"></label><label>Decode speed tok/s<input type="number" data-k="ds" value="80"></label><label>Calls per task<input type="number" data-k="c" value="1"></label></div><div class="out"></div><div class="ill">Model shape and speeds are illustrative (an 8B-class model with grouped-query attention). Use your provider’s measured TTFT and tokens/second.</div>';
  function go(){ var per=2*num(el,'[data-k=L]')*num(el,'[data-k=h]')*num(el,'[data-k=d]')*num(el,'[data-k=b]'), t=num(el,'[data-k=t]'), pre=t/Math.max(1,num(el,'[data-k=ps]')), dec=num(el,'[data-k=o]')/Math.max(1,num(el,'[data-k=ds]')), c=Math.max(1,num(el,'[data-k=c]'));

W.sampling=function(el){ el.innerHTML='<h4>Sampling lab: temperature, top-k, top-p, min-p</h4><div class="row"><label>Logits (raw scores)<input type="text" data-k="l" value="2.0, 1.0, 0.1, -0.5"></label><label>Temperature<input type="number" step="0.1" min="0.05" data-k="T" value="1"></label><label>top-k (0 = off)<input type="number" min="0" data-k="k" value="0"></label><label>top-p (1 = off)<input type="number" step="0.05" min="0" max="1" data-k="p" value="1"></label><label>min-p (0 = off)<input type="number" step="0.05" min="0" max="1" data-k="m" value="0"></label></div><div class="out"></div>';
  function go(){ var lg=el.querySelector('[data-k=l]').value.split(/[ ,]+/).filter(Boolean).map(Number).filter(function(x){return !isNaN(x);}), T=Math.max(0.05,num(el,'[data-k=T]')), k=Math.round(num(el,'[data-k=k]')), p=num(el,'[data-k=p]')||1, mp=num(el,'[data-k=m]');
    var mx=Math.max.apply(null,lg), ex=lg.map(function(x){return Math.exp((x-mx)/T);}), s=ex.reduce(function(a,b){return a+b;},0), pr=ex.map(function(x){return x/s;});
    var idx=pr.map(function(x,i){return i;}).sort(function(a,b){return pr[b]-pr[a];}), keep={};
    idx.forEach(function(i,r){ keep[i]=true; if(k>0&&r>=k) keep[i]=false; });
    var cum=0; idx.forEach(function(i){ if(!keep[i]) return; if(cum>=p-1e-9) keep[i]=false; cum+=pr[i]; });

  el.addEventListener('input',go); go(); };

document.addEventListener('click',function(e){
  var t=e.target; if(!t.closest) return; var lab=t.closest('.lab'); if(!lab) return;
  var a=t.closest('[data-labact]'), sec=t.closest('[data-labsec]'), go=t.closest('[data-labgo]');
  if(go){ e.preventDefault(); location.hash=''+LABH+go.getAttribute('data-labgo'); return; }
  if(sec){ e.preventDefault(); var x=document.getElementById('lab-'+sec.getAttribute('data-labsec')); if(x) x.scrollIntoView({behavior:'smooth'}); return; }
  if(t.closest('.lab-rail a.li')){ lab.classList.remove('railopen'); }
  if(!a) return; var act=a.getAttribute('data-labact'), id=(currentRoute().id||"");
  if(act==="rail"){ lab.classList.toggle('railopen'); }
  else if(act==="core1"){ setCore(true); }
  else if(act==="core0"){ setCore(false); }
  else if(act==="sim"){ labSim(lab.querySelector('[data-sim]')); }
  else if(act==="exdone"){ var P=n5(id); P.x=P.x?0:1; n5save(); route(); setTimeout(function(){ var x=document.getElementById('lab-exercise'); if(x) x.scrollIntoView(); },0); }
  else if(act==="complete"){ if(done[id]) delete done[id]; else done[id]=true; sSet("q2f.progress",JSON.stringify(done)); route(); setTimeout(function(){ var x=document.getElementById('lab-done'); if(x) x.scrollIntoView(); },0); }
});
document.addEventListener('keydown',function(e){ if(!document.querySelector('.lab') || !e.altKey) return; var id=currentRoute().id, ord=labOrder(), ix=ord.indexOf(id);
  if(e.key==="ArrowRight" && ix>-1 && ord[ix+1]){ e.preventDefault(); location.hash=''+LABH+ord[ix+1]; } if(e.key==="ArrowLeft" && ix>0){ e.preventDefault(); location.hash=''+LABH+ord[ix-1]; } });
function renderLabHomeK(){
  var P=PATHS[LABK], ord=labOrder(), next=ord.filter(function(id){return !done[id];})[0]||ord[0], dn=ord.filter(function(id){return done[id];}).length, full=ord.filter(function(id){return L27[id];}).length;
  var h='<div class="lab-kick">'+esc(P.name)+' · learning lab</div><h1>'+esc(P.name)+'</h1><p class="lede">'+esc(P.mission)+'</p>';
  h+='<section class="msec"><h2>Your route</h2><div class="route"><div><h3>1 · Foundations</h3><p>Every term is explained inside the modules; dotted words open a definition.</p></div><div><h3>2 · Practise</h3><p>Calculators run in your browser; practice labs use open-source tools.</p></div><div><h3>3 · Prove it</h3><p>Each module ends in a “Done when” you can show someone.</p></div></div><button class="btnp" data-labgo="'+next+'" style="padding:10px 18px">▶ '+(dn?'Continue with ':'Start with ')+next+' · '+esc(BYID[next].l.t.split(":")[0])+'</button><p class="small muted" style="margin-top:8px">'+dn+' of '+ord.length+' modules done · '+full+' written in full inside the Lab; the rest teach through their study material, lab and exercise.</p></section>';
  var br=BROUTE.filter(function(r){return inK(r[1]);});
  if(br.length) h+='<section class="msec"><h2>Beginner route</h2><p>If you’re new, take these in order — each builds only on the ones before it.</p><ol>'+br.map(function(r){return '<li><a href="'+LABH+r[1]+'">'+esc(r[0])+'</a> <span class="mono small muted">'+r[1]+'</span>'+(done[r[1]]?' ✓':'')+'</li>';}).join('')+'</ol></section>';
  h+='<section class="msec"><h2>How to read the labels</h2><table><tr><th>Label</th><th>Meaning</th></tr><tr><td>'+srcTag("v")+'</td><td>Stated in a source you can open.</td></tr><tr><td>'+srcTag("d")+'</td><td>Worked out from verified material.</td></tr><tr><td>'+srcTag("a")+'</td><td>Teaching content written for you.</td></tr><tr><td>'+srcTag("u")+'</td><td>Still needs confirming.</td></tr></table></section>';
  if(LABK==="H") h+='<section class="msec"><h2>Month by month</h2><p>The H1 2027 plan, mirrored here. December is the CT-AI intensive; each month pairs lessons with what you apply and lead at OPE.</p><table><tr><th>Month</th><th>Focus</th><th>Modules</th></tr>'+HMON.map(function(w){ return '<tr><td><b>'+esc(w[0])+'</b></td><td>'+esc(w[2])+'</td><td class="mono" style="font-size:11.5px">'+w[1].split(" ").map(function(x){return '<a href="'+LABH+x+'">'+x+'</a>';}).join(" ")+'</td></tr>'; }).join('')+'</table></section>';
  h+='<section class="msec"><h2>Stages on this path</h2><table><tr><th>Stage</th><th>Modules</th><th>Done</th></tr>'+labGroups().map(function(g){ return '<tr><td><a href="'+LABH+g.ids[0]+'">'+esc(g.t)+'</a></td><td>'+g.ids.length+'</td><td>'+g.ids.filter(function(id){return done[id];}).length+'</td></tr>'; }).join('')+'</table></section>';
  return h; }
openLM=function(id){ location.hash='#/lab/'+id; };

route();
buildTree();
</script>
